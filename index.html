 <!-- SECCIÓN PRINCIPAL — Kamil -->
 <div class="fondo"></div>
 <div class="overlay"></div>
 <section class="hero">
      <h1>Bienvenidos</h1>
      <h2>Encuentra los mejores ventiladores del pais</h2>
      <a href="#" class="boton">Explorar...</a>
    </section>
 <!-- SECCIÓN SECUNDARIA — Colaborador 2 -->

 <!-- FOOTER — acordar entre todos quién lo hace MATEO Y VICTORIA -->

    <script>

        fetch('reseñas.json')
            .then(res => res.json())
            .then(data => { 
                const contenedor = document.getElementById('container');
                contenedor.className = 'container';

                data.reseñas.forEach(rese => {
                    const card = document.createElement('div');
                    card.className ='card';

                    // Nombre del usuario
                    const name = document.createElement('h2');
                    name.className = 'name';
                    name.textContent = rese.name;

                    // Imagen del ventilador

                    const img = document.createElement('img');
                    img.className = 'image';
                    img.src = rese.image;

                    // Reseña del usuario
                    const desc = document.createElement('h3');
                    desc.className = 'res';
                    desc.textContent = rese.desc;

                    // Score del usuario
                    const sco = document.createElement('h3');
                    sco.className = 'score';
                    sco.textContent = rese.score;


                    card.appendChild(img);
                    card.appendChild(name);
                    card.appendChild(desc);
                    card.appendChild(sco);
                    contenedor.appendChild(card);
                })
            })
    </script>
 </body>
</html>
